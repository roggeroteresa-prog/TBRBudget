name: CI — Lint & Test

# Si attiva ad ogni push e ad ogni pull request verso main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Back end (lint + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Installa build tools
        run: sudo apt-get install -y python3 make g++

      - name: Install dependencies (build from source)
        run: npm ci
        env:
          npm_config_build_from_source: true
      - name: Debug binario better-sqlite3
        run: |
          node -e "console.log('ABI:', process.versions.modules)"
          node -e "console.log('Node:', process.version)"
          uname -a
          ldd --version | head -1
          # Trova il .node compilato
          find node_modules/better-sqlite3 -name "*.node" | head -5
          # Controlla le dipendenze del binario
          find node_modules/better-sqlite3 -name "*.node" -exec ldd {} \;
          # Controlla se è stato compilato da sorgente o è precompilato
          ls -la node_modules/better-sqlite3/build/Release/ 2>/dev/null || echo "no build/Release"
          ls -la node_modules/better-sqlite3/prebuilds/ 2>/dev/null || echo "no prebuilds"
      - name: Diagnostica SQLite (temporanea, per isolare il crash)
        run: |
          echo "--- versione Node ---"
          node --version
          echo "--- versione better-sqlite3 installata ---"
          npm ls better-sqlite3
          echo "--- 1) solo require del modulo ---"
          node -e "require('better-sqlite3'); console.log('require OK')"
          echo "--- 2) database in memoria, nessun file coinvolto ---"
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database(':memory:');
            db.exec('CREATE TABLE t (x INTEGER)');
            db.prepare('INSERT INTO t VALUES (?)').run(1);
            console.log('in-memory OK:', db.prepare('SELECT * FROM t').get());
          "
          echo "--- 3) database su file, con pragma WAL (come in db.js) ---"
          node -e "
            const Database = require('better-sqlite3');
            const db = new Database('/tmp/diagnostica.db');
            db.pragma('journal_mode = WAL');
            db.exec('CREATE TABLE t (x INTEGER)');
            db.prepare('INSERT INTO t VALUES (?)').run(1);
            console.log('file+WAL OK:', db.prepare('SELECT * FROM t').get());
          "
          echo "--- 4) require diretto di db.js (schema completo + migrazione dai JSON) ---"
          rm -f src/data/tbr.db src/data/tbr.db-wal src/data/tbr.db-shm
          node -e "require('./src/services/db.js'); console.log('db.js OK')"

      - name: Lint (controllo sintassi su tutti i file sorgente)
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Test
        run: npm test
        env:
          OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
          JWT_SECRET: ci-placeholder-secret-not-used-in-production

  frontend:
    name: Front end (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (controllo sintassi sui file .js semplici)
        run: |
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Build (valida anche la sintassi JSX)
        run: npm run build

  data_agent:
    name: Data agent Python (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controllo sintassi
        run: |
          python -m py_compile main.py pandas_agent.py