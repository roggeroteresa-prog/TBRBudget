<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8102e"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f4f5f7"/>

  <!-- Title -->
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="800" fill="#1e1e1e">TBR Sales &amp; Budget Agent — Architettura a Microservizi</text>
  <text x="700" y="66" text-anchor="middle" font-size="13" fill="#888">Progetto Finale — Master AI e Agenti AI per il Business</text>

  <!-- ══════════ Utente ══════════ -->
  <rect x="600" y="90" width="200" height="46" rx="10" fill="#1e1e1e"/>
  <text x="700" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Utente (browser)</text>

  <line x1="700" y1="136" x2="700" y2="172" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════ Front end ══════════ -->
  <rect x="380" y="174" width="640" height="90" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="700" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#1e1e1e">FRONT END — React + Vite</text>
  <text x="410" y="222" font-size="12" fill="#444">📊 Gestione Budget</text>
  <text x="560" y="222" font-size="12" fill="#444">💰 Budget dei Ricavi</text>
  <text x="720" y="222" font-size="12" fill="#444">📈 Report</text>
  <text x="830" y="222" font-size="12" fill="#444">🤖 Assistente (Chat)</text>
  <text x="410" y="244" font-size="11.5" fill="#999">memoria conversazionale · typing indicator · render testo/tabelle/grafici</text>

  <line x1="700" y1="264" x2="700" y2="300" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="712" y="286" font-size="11" fill="#777">POST /api/chat, /api/budgets/*</text>

  <!-- ══════════ Back end orchestratore ══════════ -->
  <rect x="330" y="302" width="740" height="110" rx="12" fill="#1e1e1e"/>
  <text x="700" y="328" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">BACK END — Node.js / Express (Orchestratore)</text>
  <text x="700" y="350" text-anchor="middle" font-size="12" fill="#ddd">Session state · ciclo ReAct (Reason + Act) con function calling nativo OpenAI SDK</text>
  <rect x="352" y="362" width="220" height="34" rx="8" fill="#2a2a2a"/>
  <text x="462" y="383" text-anchor="middle" font-size="11" fill="#eee">ragService.js (RAG)</text>
  <rect x="590" y="362" width="220" height="34" rx="8" fill="#2a2a2a"/>
  <text x="700" y="383" text-anchor="middle" font-size="11" fill="#eee">dataAgentService.js</text>
  <rect x="828" y="362" width="220" height="34" rx="8" fill="#2a2a2a"/>
  <text x="938" y="383" text-anchor="middle" font-size="11" fill="#eee">budgetAgentTools.js</text>

  <!-- OpenAI, side -->
  <rect x="1120" y="316" width="230" height="60" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/>
  <text x="1235" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#c8102e">OpenAI API</text>
  <text x="1235" y="358" text-anchor="middle" font-size="10.5" fill="#777">gpt-4o-mini · function calling</text>
  <line x1="1120" y1="346" x2="1070" y2="346" stroke="#c8102e" stroke-width="2" marker-end="url(#arrowRed)"/>
  <line x1="1070" y1="346" x2="1120" y2="346" stroke="#c8102e" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Arrows down to 3 services -->
  <line x1="462" y1="412" x2="462" y2="452" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="412" x2="700" y2="452" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="938" y1="412" x2="938" y2="452" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ══════════ ChromaDB ══════════ -->
  <rect x="352" y="454" width="220" height="86" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="462" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#1e1e1e">ChromaDB</text>
  <text x="462" y="498" text-anchor="middle" font-size="11" fill="#666">Vector store locale</text>
  <text x="462" y="514" text-anchor="middle" font-size="11" fill="#666">retrieval semantico (RAG)</text>
  <text x="462" y="530" text-anchor="middle" font-size="10" fill="#999">porta 8001</text>

  <!-- ══════════ Data Agent Python ══════════ -->
  <rect x="590" y="454" width="220" height="86" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="700" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#1e1e1e">Data Agent (Python)</text>
  <text x="700" y="498" text-anchor="middle" font-size="11" fill="#666">FastAPI + pandas agent</text>
  <text x="700" y="514" text-anchor="middle" font-size="11" fill="#666">pulizia dati · tabelle · grafici</text>
  <text x="700" y="530" text-anchor="middle" font-size="10" fill="#999">porta 8000</text>

  <!-- ══════════ Budget Store ══════════ -->
  <rect x="828" y="454" width="220" height="86" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="938" y="480" text-anchor="middle" font-size="13" font-weight="800" fill="#1e1e1e">Budget Store</text>
  <text x="938" y="498" text-anchor="middle" font-size="11" fill="#666">budgetStore.js + services</text>
  <text x="938" y="514" text-anchor="middle" font-size="11" fill="#666">dimensioni · currency · righe</text>
  <text x="938" y="530" text-anchor="middle" font-size="10" fill="#999">file JSON, no DB</text>

  <!-- Arrows down to data sources -->
  <line x1="462" y1="540" x2="462" y2="580" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="700" y1="540" x2="700" y2="580" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="938" y1="540" x2="800" y2="580" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="938" y1="540" x2="1080" y2="580" stroke="#c8102e" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- ══════════ Data sources ══════════ -->
  <rect x="352" y="582" width="220" height="66" rx="10" fill="#fef6f7" stroke="#e8b3ba" stroke-width="1.5"/>
  <text x="462" y="608" text-anchor="middle" font-size="12" font-weight="700" fill="#333">tbr_kb.md</text>
  <text x="462" y="626" text-anchor="middle" font-size="10.5" fill="#777">knowledge base (8 sezioni)</text>

  <rect x="590" y="582" width="220" height="66" rx="10" fill="#fef6f7" stroke="#e8b3ba" stroke-width="1.5"/>
  <text x="700" y="608" text-anchor="middle" font-size="12" font-weight="700" fill="#333">tbr_sales.csv</text>
  <text x="700" y="626" text-anchor="middle" font-size="10.5" fill="#777">1275 righe, dati "sporchi"</text>

  <rect x="828" y="582" width="220" height="66" rx="10" fill="#fef6f7" stroke="#e8b3ba" stroke-width="1.5"/>
  <text x="938" y="608" text-anchor="middle" font-size="12" font-weight="700" fill="#333">budgets-store.json</text>
  <text x="938" y="626" text-anchor="middle" font-size="10.5" fill="#777">budget + righe persistiti</text>

  <rect x="1000" y="582" width="180" height="66" rx="10" fill="#fff" stroke="#c8102e" stroke-width="1.5"/>
  <text x="1090" y="608" text-anchor="middle" font-size="12" font-weight="700" fill="#c8102e">Frankfurter API</text>
  <text x="1090" y="626" text-anchor="middle" font-size="10.5" fill="#777">tassi di cambio live (BCE)</text>

  <!-- ══════════ Legend ══════════ -->
  <rect x="60" y="700" width="1280" height="150" rx="12" fill="#fff" stroke="#ddd" stroke-width="1.5"/>
  <text x="86" y="728" font-size="13" font-weight="800" fill="#1e1e1e">Flusso decisionale dell'orchestratore (ReAct)</text>
  <text x="86" y="752" font-size="11.5" fill="#444">1. L'utente scrive un messaggio (domanda o richiesta d'azione) nella chat.</text>
  <text x="86" y="772" font-size="11.5" fill="#444">2. L'LLM, tramite function calling, decide autonomamente quale/i strumento/i chiamare: RAG (domande su policy/procedure), Data Agent (analisi dati/grafici) o Budget Tools (creare/configurare/modificare budget).</text>
  <text x="86" y="792" font-size="11.5" fill="#444">3. Se mancano parametri per un'azione, l'LLM li chiede esplicitamente all'utente prima di procedere; per azioni che modificano dati, chiede conferma.</text>
  <text x="86" y="812" font-size="11.5" fill="#444">4. Il risultato dello strumento rientra nel ciclo: l'LLM può chiamarne altri (max 8 iterazioni) o comporre la risposta finale (testo + tabella + eventuale grafico).</text>
  <text x="86" y="836" font-size="11" fill="#888" font-style="italic">I Budget Tools riusano esattamente gli stessi servizi delle pagine web (nessuna logica duplicata): chat e interfaccia restano sempre coerenti.</text>

  <!-- Legend color key -->
  <rect x="1180" y="90" width="14" height="14" fill="#1e1e1e"/>
  <text x="1200" y="102" font-size="10.5" fill="#555">Componente applicativo</text>
  <rect x="1180" y="112" width="14" height="14" fill="#fef6f7" stroke="#e8b3ba"/>
  <text x="1200" y="124" font-size="10.5" fill="#555">Sorgente dati / persistenza</text>
  <rect x="1180" y="134" width="14" height="14" fill="#fff" stroke="#c8102e" stroke-width="1.5"/>
  <text x="1200" y="146" font-size="10.5" fill="#555">Servizio esterno (API)</text>
</svg>
